<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict - Gold Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: bold;
            color: #764ba2 !important;
        }
        .nav-link {
            color: #333 !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #764ba2 !important;
        }
        .nav-link.active {
            color: #764ba2 !important;
            border-bottom: 2px solid #764ba2;
        }
        .predict-container {
            padding: 40px 0;
        }
        .predict-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .section-title {
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #764ba2;
            padding-bottom: 10px;
        }
        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s;
            width: 100%;
        }
        .btn-predict:hover {
            transform: scale(1.02);
            color: white;
        }
        .btn-predict:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #764ba2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .prediction-plot {
            width: 100%;
            height: 500px;
            margin-top: 20px;
        }
        .prediction-table {
            max-height: 400px;
            overflow-y: auto;
        }
        .prediction-table table {
            width: 100%;
        }
        .prediction-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: sticky;
            top: 0;
        }
        .confidence-badge {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
        }
        footer {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line"></i> GoldPrice Predictor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/train">Train Model</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/predict">Predict</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analyze">Analyze</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="predict-container">
        <div class="container">
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="predict-card">
                        <h2 class="section-title">
                            <i class="fas fa-chart-line"></i> Predict Gold Prices
                        </h2>
                        
                        <!-- Prediction Form -->
                        <form id="predictForm">
                            <div class="mb-3">
                                <label for="days" class="form-label">Number of Days to Predict</label>
                                <input type="number" class="form-control" id="days" name="days" min="1" max="90" value="30" required>
                                <small class="text-muted">Choose between 1-90 days</small>
                            </div>
                            
                            <button type="submit" class="btn-predict" id="predictBtn">
                                <i class="fas fa-magic"></i> Generate Predictions
                            </button>
                        </form>
                        
                        <!-- Loader -->
                        <div class="loader" id="loader"></div>
                        
                        <!-- Results Section -->
                        <div id="results" style="display: none;">
                            <hr class="my-4">
                            
                            <!-- Plot -->
                            <div class="prediction-plot" id="plotContainer"></div>
                            
                            <!-- Predictions Table -->
                            <h3 class="mt-4 mb-3">Predicted Prices</h3>
                            <div class="prediction-table" id="tableContainer"></div>
                            
                            <!-- Download Button -->
                            <div class="text-center mt-4">
                                <button class="btn btn-success" onclick="downloadPredictions()">
                                    <i class="fas fa-download"></i> Download Predictions
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 Gold Price Predictor. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <script>
        let currentPredictions = [];
        
        document.getElementById('predictForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const predictBtn = document.getElementById('predictBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            
            // Disable button and show loader
            predictBtn.disabled = true;
            loader.style.display = 'block';
            results.style.display = 'none';
            
            // Get form data
            const formData = new FormData(this);
            
            try {
                // Send prediction request
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Display plot
                    document.getElementById('plotContainer').innerHTML = data.plot_html;
                    
                    // Display predictions table
                    displayPredictionsTable(data.predictions);
                    
                    // Store predictions for download
                    currentPredictions = data.predictions;
                    
                    results.style.display = 'block';
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error making predictions: ' + error.message);
            } finally {
                // Re-enable button and hide loader
                predictBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
        
        function displayPredictionsTable(predictions) {
            let html = `
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Predicted Price (USD/oz)</th>
                            <th>Lower Bound (95%)</th>
                            <th>Upper Bound (95%)</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            predictions.forEach(pred => {
                const lower = (pred.Predicted_Price * 0.95).toFixed(2);
                const upper = (pred.Predicted_Price * 1.05).toFixed(2);
                html += `
                    <tr>
                        <td>${pred.Date}</td>
                        <td><strong>$${pred.Predicted_Price.toFixed(2)}</strong></td>
                        <td>$${lower}</td>
                        <td>$${upper}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
        }
        
        function downloadPredictions() {
            if (currentPredictions.length === 0) return;
            
            // Create CSV content
            let csv = 'Date,Predicted_Price,Lower_Bound,Upper_Bound\n';
            currentPredictions.forEach(pred => {
                const lower = (pred.Predicted_Price * 0.95).toFixed(2);
                const upper = (pred.Predicted_Price * 1.05).toFixed(2);
                csv += `${pred.Date},${pred.Predicted_Price.toFixed(2)},${lower},${upper}\n`;
            });
            
            // Download CSV
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gold_price_predictions.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
