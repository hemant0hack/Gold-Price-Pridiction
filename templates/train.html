<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Model - Gold Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: bold;
            color: #764ba2 !important;
        }
        .nav-link {
            color: #333 !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #764ba2 !important;
        }
        .nav-link.active {
            color: #764ba2 !important;
            border-bottom: 2px solid #764ba2;
        }
        .train-container {
            padding: 40px 0;
        }
        .train-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .section-title {
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #764ba2;
            padding-bottom: 10px;
        }
        .btn-train {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s;
            width: 100%;
        }
        .btn-train:hover {
            transform: scale(1.02);
            color: white;
        }
        .btn-train:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
        }
        .metric-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #764ba2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result-section {
            display: none;
        }
        .feature-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin: 2px;
            display: inline-block;
        }
        footer {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line"></i> GoldPrice Predictor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/train">Train Model</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/predict">Predict</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analyze">Analyze</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="train-container">
        <div class="container">
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="train-card">
                        <h2 class="section-title">
                            <i class="fas fa-cogs"></i> Train Model
                        </h2>
                        
                        <!-- Training Form -->
                        <form id="trainForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="start_date" class="form-label">Start Date</label>
                                    <input type="date" class="form-control" id="start_date" name="start_date" value="2016-01-01" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="end_date" class="form-label">End Date</label>
                                    <input type="date" class="form-control" id="end_date" name="end_date" value="2026-12-31" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Model Configuration</label>
                                <div class="alert alert-info">
                                    <i class="fas fa-info-circle"></i> Using XGBoost algorithm with optimized parameters for gold price prediction.
                                </div>
                            </div>
                            
                            <button type="submit" class="btn-train" id="trainBtn">
                                <i class="fas fa-play"></i> Start Training
                            </button>
                        </form>
                        
                        <!-- Loader -->
                        <div class="loader" id="loader"></div>
                        
                        <!-- Results Section -->
                        <div class="result-section" id="resultSection">
                            <hr class="my-4">
                            <h3 class="text-center mb-4">Training Results</h3>
                            
                            <div class="row" id="metrics">
                                <!-- Metrics will be inserted here -->
                            </div>
                            
                            <div class="alert alert-success mt-4" id="successMessage">
                                <i class="fas fa-check-circle"></i> Model trained successfully!
                            </div>
                            
                            <div class="text-center mt-4">
                                <a href="/predict" class="btn btn-primary">
                                    <i class="fas fa-arrow-right"></i> Go to Predictions
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 Gold Price Predictor. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('trainForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const trainBtn = document.getElementById('trainBtn');
            const loader = document.getElementById('loader');
            const resultSection = document.getElementById('resultSection');
            const metricsDiv = document.getElementById('metrics');
            
            // Disable button and show loader
            trainBtn.disabled = true;
            loader.style.display = 'block';
            resultSection.style.display = 'none';
            
            // Get form data
            const formData = new FormData(this);
            
            try {
                // Send training request
                const response = await fetch('/train', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Display results
                    metricsDiv.innerHTML = `
                        <div class="col-md-4">
                            <div class="metric-card">
                                <div class="metric-value">$${data.results.test_rmse.toFixed(2)}</div>
                                <div class="metric-label">Test RMSE</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="metric-card">
                                <div class="metric-value">${(data.results.test_r2 * 100).toFixed(2)}%</div>
                                <div class="metric-label">R² Score</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="metric-card">
                                <div class="metric-value">$${data.results.test_mae.toFixed(2)}</div>
                                <div class="metric-label">Test MAE</div>
                            </div>
                        </div>
                    `;
                    
                    resultSection.style.display = 'block';
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error training model: ' + error.message);
            } finally {
                // Re-enable button and hide loader
                trainBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
