<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze - Gold Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: bold;
            color: #764ba2 !important;
        }
        .nav-link {
            color: #333 !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #764ba2 !important;
        }
        .nav-link.active {
            color: #764ba2 !important;
            border-bottom: 2px solid #764ba2;
        }
        .analyze-container {
            padding: 40px 0;
        }
        .analyze-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .section-title {
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #764ba2;
            padding-bottom: 10px;
        }
        .btn-analyze {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s;
            width: 100%;
        }
        .btn-analyze:hover {
            transform: scale(1.02);
            color: white;
        }
        .btn-analyze:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #764ba2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .plot-container {
            width: 100%;
            height: 400px;
            margin: 20px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        footer {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line"></i> GoldPrice Predictor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/train">Train Model</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/predict">Predict</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/analyze">Analyze</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="analyze-container">
        <div class="container">
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="analyze-card">
                        <h2 class="section-title">
                            <i class="fas fa-chart-pie"></i> Analyze Historical Data
                        </h2>
                        
                        <!-- Analysis Form -->
                        <form id="analyzeForm">
                            <div class="mb-3">
                                <label for="years" class="form-label">Number of Years to Analyze</label>
                                <input type="number" class="form-control" id="years" name="years" min="1" max="10" value="5" required>
                                <small class="text-muted">Choose between 1-10 years of historical data</small>
                            </div>
                            
                            <button type="submit" class="btn-analyze" id="analyzeBtn">
                                <i class="fas fa-search"></i> Analyze Data
                            </button>
                        </form>
                        
                        <!-- Loader -->
                        <div class="loader" id="loader"></div>
                        
                        <!-- Results Section -->
                        <div id="results" style="display: none;">
                            <hr class="my-4">
                            
                            <!-- Summary Statistics -->
                            <div class="row mb-4" id="summaryStats">
                                <!-- Will be populated by JS -->
                            </div>
                            
                            <!-- Plots -->
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="plot-container" id="plotTrend"></div>
                                </div>
                                <div class="col-md-6">
                                    <div class="plot-container" id="plotMonthly"></div>
                                </div>
                                <div class="col-md-6">
                                    <div class="plot-container" id="plotYearly"></div>
                                </div>
                                <div class="col-md-6">
                                    <div class="plot-container" id="plotDistribution"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 Gold Price Predictor. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <script>
        document.getElementById('analyzeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const analyzeBtn = document.getElementById('analyzeBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            
            // Disable button and show loader
            analyzeBtn.disabled = true;
            loader.style.display = 'block';
            results.style.display = 'none';
            
            // Get form data
            const formData = new FormData(this);
            
            try {
                // Send analysis request
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Display plots
                    document.getElementById('plotTrend').innerHTML = data.plots.trend;
                    document.getElementById('plotMonthly').innerHTML = data.plots.monthly;
                    document.getElementById('plotYearly').innerHTML = data.plots.yearly;
                    document.getElementById('plotDistribution').innerHTML = data.plots.distribution;
                    
                    results.style.display = 'block';
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error analyzing data: ' + error.message);
            } finally {
                // Re-enable button and hide loader
                analyzeBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
